<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IM chat</title>
<style>
  :root {
    --bg-main: #FAF2E8;       
    --surface: #FFFFFF;       
    --sage-green: #8EA66B;    
    --sage-dark: #789056;     
    --light-pink: #ebd6d6;   
    --muted-rose: #d26765;   
    --text-dark: #2C2825;
    --text-muted: #8C827B;    
    --border-subtle: #EBE1D7;
    --error: #ac1212;         
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-main); color: var(--text-dark);
    display: flex; align-items: center; justify-content: center;
  }
  button {
    font: inherit; cursor: pointer; border: none; border-radius: 8px;
    padding: 10px 16px; background: var(--sage-green); color: var(--text-dark); font-weight: 600;
    transition: background .15s;
  }
  button:hover { background: var(--sage-dark); }
  button:disabled { opacity: .5; cursor: default; }
  input {
    font: inherit; color: var(--text-dark); background: var(--surface);
    border: 1px solid var(--border-subtle); border-radius: 8px; padding: 10px 12px; outline: none;
  }
  input::placeholder { color: var(--text-muted); }
  input:focus { border-color: var(--sage-green); box-shadow: 0 0 0 3px rgba(142,166,107,.2); }

  /* login */
  #login {
    width: 340px; max-width: 92vw; background: var(--surface); border: 1px solid var(--border-subtle);
    border-radius: 14px; padding: 36px 28px; text-align: center;
  }
  #login .logo {
    width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 16px;
    background: var(--sage-green); color: var(--text-dark); font-size: 18px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  #login h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
  #login p { margin: 0 0 22px; color: var(--text-muted); font-size: 14px; }
  #login input { width: 100%; margin-bottom: 12px; text-align: center; }
  #login button { width: 100%; }
  #loginError { color: var(--error); font-size: 14px; min-height: 20px; margin-top: 10px; }

  /* chat layout */
  #chat {
    display: none; width: 980px; max-width: 98vw; height: 92vh; max-height: 760px;
    background: var(--surface); border: 1px solid var(--border-subtle);
    border-radius: 14px; overflow: hidden;
  }
  #chat.on { display: flex; }

  #side {
    width: 240px; flex-shrink: 0; background: var(--bg-main); border-right: 1px solid var(--border-subtle);
    padding: 20px 16px; display: flex; flex-direction: column; gap: 22px; overflow-y: auto;
  }
  .me-card { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; background: var(--sage-green); color: var(--text-dark);
    font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .me-card .name { font-weight: 600; }
  .me-card .status { font-size: 12px; color: var(--text-muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--sage-green); margin-right: 5px; }
  .dot.off { background: var(--muted-rose); }
  h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
  #rooms { display: flex; flex-direction: column; gap: 6px; }
  .room {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface); border: 1px solid var(--border-subtle);
    border-radius: 8px; padding: 7px 12px; font-size: 14px;
  }
  .room button {
    background: transparent; color: var(--text-muted); padding: 0 4px; font-size: 18px; line-height: 1; font-weight: 400;
  }
  .room button:hover { background: transparent; color: var(--muted-rose); }
  .join-row { display: flex; gap: 6px; }
  .join-row input { flex: 1; min-width: 0; padding: 8px 10px; }
  .join-row button { padding: 8px 12px; }
  .hint { font-size: 12px; color: var(--text-muted); line-height: 1.5; }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #head { padding: 16px 22px; border-bottom: 1px solid var(--border-subtle); font-weight: 600; }
  #head span { font-weight: 400; color: var(--text-muted); font-size: 13px; margin-left: 8px; }
  #log { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; flex-direction: column; max-width: 75%; }
  .row.mine { align-self: flex-end; align-items: flex-end; }
  .row .who { font-size: 12px; color: var(--text-muted); margin: 0 4px 3px; }
  .bubble {
    background: var(--bg-main); border: 1px solid var(--border-subtle); padding: 8px 13px; border-radius: 12px;
    word-wrap: break-word; overflow-wrap: anywhere; white-space: pre-wrap;
  }
  .row.mine .bubble { background: var(--light-pink); border-color: var(--light-pink); }
  .row.mine.private .bubble { background: var(--muted-rose); border-color: var(--muted-rose); }
  .time { font-size: 11px; color: var(--text-muted); margin: 3px 4px 0; }
  .system { align-self: center; font-size: 12px; color: var(--text-muted); padding: 2px 10px; }
  .system.err { color: var(--error); }

  #composer { padding: 14px 18px; border-top: 1px solid var(--border-subtle); display: flex; gap: 8px; }
  #to { width: 130px; }
  #msg { flex: 1; min-width: 0; }

  @media (max-width: 700px) {
    #chat.on { flex-direction: column; height: 98vh; }
    #side { width: 100%; max-height: 36%; border-right: none; border-bottom: 1px solid var(--border-subtle); }
    #to { width: 90px; }
  }
</style>
</head>
<body>

<div id="login">
  <div class="logo">IM</div>
  <h1>Welcome</h1>
  <p>Pick a name to join the chat</p>
  <input id="nameInput" placeholder="Your name (no spaces)" maxlength="24" autofocus>
  <button id="connectBtn" onclick="connect()">Join chat</button>
  <div id="loginError"></div>
</div>

<div id="chat">
  <div id="side">
    <div class="me-card">
      <div class="avatar" id="avatar">?</div>
      <div>
        <div class="name" id="myName"></div>
        <div class="status"><span class="dot" id="dot"></span><span id="statusText">Online</span></div>
      </div>
    </div>

    <div>
      <h3>My rooms</h3>
      <div id="rooms"></div>
    </div>

    <div>
      <h3>Join or create a room</h3>
      <div class="join-row">
        <input id="roomInput" placeholder="Room name" maxlength="24">
        <button onclick="joinRoom()">Join</button>
      </div>
    </div>

    <div class="hint">
      Your messages go to all rooms you are in.<br>
      To send a private message, fill in the "To" box next to the message.
    </div>
  </div>

  <div id="main">
    <div id="head">Chat<span id="headRooms"></span></div>
    <div id="log"></div>
    <div id="composer">
      <input id="to" placeholder="To (optional)" maxlength="24">
      <input id="msg" placeholder="Type a message..." autocomplete="off">
      <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script>
var socket = null;
var named = false;
var pendingGroups = false;
var myName = "";

function $(id) { return document.getElementById(id); }

function time() {
  var d = new Date();
  return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
}

/* ---------- screens ---------- */

function connect() {
  var name = $("nameInput").value.trim();
  if (name === "") { $("loginError").textContent = "Please enter a name."; return; }
  if (/\s/.test(name)) { $("loginError").textContent = "The name must not contain spaces."; return; }
  if (name.charAt(0) === "#") { $("loginError").textContent = "The name must not start with #."; return; }

  $("loginError").textContent = "";
  $("connectBtn").disabled = true;
  $("connectBtn").textContent = "Connecting...";
  myName = name;
  named = false;

  var wsPort = (parseInt(location.port) || 80) + 1; // bridge: WebSocket port = HTTP port + 1
  socket = new WebSocket("ws://" + location.hostname + ":" + wsPort);
  socket.onopen = function () { socket.send(name); }; // first message = name
  socket.onmessage = function (e) { onLine(e.data); };
  socket.onclose = function () { connectionLost(); };
}

function loginFailed(text) {
  closeConnection();
  $("connectBtn").disabled = false;
  $("connectBtn").textContent = "Join chat";
  $("loginError").textContent = text;
  $("nameInput").focus();
}

function showChat() {
  $("login").style.display = "none";
  $("chat").classList.add("on");
  $("myName").textContent = myName;
  $("avatar").textContent = myName.charAt(0).toUpperCase();
  $("msg").focus();
  addSystem("You joined as " + myName);
}

function closeConnection() {
  if (socket) {
    socket.onclose = null;
    socket.close();
    socket = null;
  }
}

function connectionLost() {
  if (!named) {
    loginFailed("Could not connect to the server.");
    return;
  }
  socket = null;
  $("dot").classList.add("off");
  $("statusText").textContent = "Disconnected";
  $("sendBtn").disabled = true;
  $("msg").disabled = true;
  var s = addSystem("Connection lost. Reload the page to reconnect.");
  s.classList.add("err");
}

/* ---------- incoming ---------- */

function onLine(line) {
  if (!named) {
    if (line.indexOf("Your name is now") === 0) {
      named = true;
      showChat();
      requestGroups();
    } else if (line.indexOf("already taken") >= 0) {
      loginFailed("That name is already taken, try another one.");
    } else if (line.indexOf("must not contain") >= 0) {
      loginFailed("The name must not contain spaces.");
    }
    return; // ignore welcome text
  }

  var chat = line.match(/^\[(.+?)\] >> ([\s\S]*)$/);

  // answer to #groups: a single word list like "public,MyRoom"
  if (pendingGroups && !chat && !/\s/.test(line)) {
    pendingGroups = false;
    showRooms(line.split(","));
    return;
  }

  if (chat) {
    addBubble(chat[1], chat[2], false, false);
  } else if (/^(Joined|Left) /.test(line)) {
    addSystem(line);
    requestGroups();
  } else {
    var s = addSystem(line);
    if (/not found|not in|already in|Usage|Unknown|Set your name/.test(line)) s.classList.add("err");
  }
}

/* ---------- output helpers ---------- */

function scrollDown() { var log = $("log"); log.scrollTop = log.scrollHeight; }

function addSystem(text) {
  var div = document.createElement("div");
  div.className = "system";
  div.textContent = text;
  $("log").appendChild(div);
  scrollDown();
  return div;
}

function addBubble(who, text, mine, isPrivate) {
  var row = document.createElement("div");
  row.className = "row" + (mine ? " mine" : "") + (isPrivate ? " private" : "");

  var w = document.createElement("div");
  w.className = "who";
  w.textContent = who;

  var b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;

  var t = document.createElement("div");
  t.className = "time";
  t.textContent = time();

  row.appendChild(w);
  row.appendChild(b);
  row.appendChild(t);
  $("log").appendChild(row);
  scrollDown();
}

function showRooms(list) {
  var box = $("rooms");
  box.innerHTML = "";
  for (var i = 0; i < list.length; i++) {
    (function (room) {
      var div = document.createElement("div");
      div.className = "room";
      var span = document.createElement("span");
      span.textContent = "# " + room;
      var btn = document.createElement("button");
      btn.innerHTML = "&times;";
      btn.title = "Leave " + room;
      btn.onclick = function () { raw("#leave " + room); };
      div.appendChild(span);
      div.appendChild(btn);
      box.appendChild(div);
    })(list[i]);
  }
  $("headRooms").textContent = list.join(", ");
}

/* ---------- sending ---------- */

function raw(text) {
  if (socket === null || socket.readyState !== 1) return;
  socket.send(text);
}

function requestGroups() {
  pendingGroups = true;
  raw("#groups");
}

function sendMessage() {
  var text = $("msg").value.trim();
  var to = $("to").value.trim();
  if (text === "") return;

  if (text.charAt(0) === "#") {
    raw(text);
    addSystem("Command: " + text);
  } else if (to !== "") {
    raw("#sendPrivate " + to + " " + text);
    addBubble("You (private to " + to + ")", text, true, true);
  } else {
    raw(text);
    addBubble("You", text, true, false);
  }
  $("msg").value = "";
  $("msg").focus();
}

function joinRoom() {
  var room = $("roomInput").value.trim();
  if (room === "") return;
  if (/\s/.test(room)) { addSystem("Room name must not contain spaces.").classList.add("err"); return; }
  raw("#join " + room);
  $("roomInput").value = "";
}

/* ---------- events ---------- */

$("nameInput").addEventListener("keydown", function (e) { if (e.key === "Enter") connect(); });
$("msg").addEventListener("keydown", function (e) { if (e.key === "Enter") sendMessage(); });
$("to").addEventListener("keydown", function (e) { if (e.key === "Enter") $("msg").focus(); });
$("roomInput").addEventListener("keydown", function (e) { if (e.key === "Enter") joinRoom(); });
</script>
</body>
</html>
